# Dev stack with hot reload. Postgres is the control-plane store.
# api/web run from bind-mounted source; per-service node_modules volumes keep
# native modules (musl/glibc) isolated from the host.
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mongo_optimizer
      POSTGRES_PASSWORD: mongo_optimizer
      POSTGRES_DB: mongo_optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mongo_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local demo target to exercise the collector (NOT a customer cluster).
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: docker.io/library/node:24-slim
    working_dir: /app
    command: sh -c "npm install && npx turbo run dev --filter=@repo/api"
    environment:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@postgres:5432/mongo_optimizer
      API_PORT: "3001"
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: docker.io/library/node:24-slim
    working_dir: /app
    command: sh -c "npm install && npx turbo run dev --filter=@repo/web"
    environment:
      WEB_PORT: "3000"
      VITE_API_URL: http://localhost:3001
      VITE_WEB_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  # Background worker: runs the cron schedule (collect/apply/finalize per cluster).
  worker:
    image: docker.io/library/node:24-slim
    working_dir: /app
    command: sh -c "npm install && npx turbo run build --filter=@repo/api^... && npm run worker -w @repo/api"
    environment:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@postgres:5432/mongo_optimizer
      MASTER_KEY: ${MASTER_KEY}
      WORKER_CONCURRENCY: "2"
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
  api_node_modules:
  web_node_modules:
  worker_node_modules:
