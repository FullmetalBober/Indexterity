# Dev stack with hot reload. Postgres is the control-plane store.
# api/web run from bind-mounted source; per-service node_modules volumes keep
# native modules (musl/glibc) isolated from the host.
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mongo_optimizer
      POSTGRES_PASSWORD: mongo_optimizer
      POSTGRES_DB: mongo_optimizer
    ports:
      # Host 5433: 5432 is a common squatter target (another project's postgres
      # here); .env and the docs use localhost:5433 to match.
      - "5433:5432"
    volumes:
      # postgres:18+ keeps data in a version-specific subdirectory and refuses a
      # mount at the pre-18 /var/lib/postgresql/data. The volume is named for
      # its major version: a v17 directory is not readable by 18 without
      # pg_upgrade, so a bump gets a new volume and a dump/restore.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mongo_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: docker.io/library/node:26-slim
    working_dir: /app
    # `exec` so the real process becomes PID 1 and podman's SIGTERM reaches it.
    # Without it `sh` is PID 1, and a non-interactive shell does not forward
    # signals to the child it is waiting on — so every container ignored stop,
    # sat out the ten-second grace period, and was SIGKILLed (exit 137). That is
    # what breaks `down`: the teardown races the stragglers, pod and network
    # removal fail, and the next `up` reuses a container whose runtime state is
    # already gone ("cannot open .../exec.fifo").
    command: sh -c "npm install && exec npx turbo run dev --filter=@repo/api"
    environment:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@postgres:5432/mongo_optimizer
      # Which implementation carries a WireGuard peering (D111). `binary` needs
      # apps/tunnel built for this container's platform — `npm run build` does
      # that, and the tree is mounted, so a flip plus a restart is the whole
      # change. Left on the userspace stack by default so a fresh clone needs no
      # Go toolchain.
      TUNNEL_RUNTIME: ${TUNNEL_RUNTIME:-node}
      API_PORT: "3001"
      # Dev targets live on the compose network; sign-up is open for convenience.
      ALLOW_PRIVATE_CLUSTER_TARGETS: "true"
      # A local mongod has no certificate, and the integration and e2e suites
      # dial one on purpose. Never set this in a deployment that dials real
      # customer databases.
      ALLOW_INSECURE_CLUSTER_TLS: "true"
      SIGNUP_MODE: open
      # Off in dev so nothing demands an authenticator app of a test account;
      # a hosted install sets it (see .env.example, REQUIRE_OWNER_2FA).
      REQUIRE_OWNER_2FA: "false"
      # The DASHBOARD's origin, not this container's port: better-auth appends
      # /api/auth itself, and the browser reaches all of it on 3000. It is also
      # what the reset links in emails are built from.
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      # A KEK rotation, and a retired key. Passed through empty when unset, which
      # the schema reads as absent (withoutBlanks) — so these cost nothing until
      # a rotation names them. MASTER_KEY_V1 is how an OLD first key is supplied
      # by name while MASTER_KEY_V2 holds the live one.
      MASTER_KEY_VERSION: ${MASTER_KEY_VERSION}
      MASTER_KEY_V1: ${MASTER_KEY_V1}
      MASTER_KEY_V2: ${MASTER_KEY_V2}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      # Both containers serve /metrics on 9464 and report different parts of
      # the picture, so each gets its own host port: api 9464, web 9466.
      METRICS_ENABLED: "true"
      # Error reporting, off unless SENTRY_DSN_API is in .env. Reads plain
      # SENTRY_DSN here; which project that is belongs to the deployment, and
      # for this one it is indexterity-api.
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    ports:
      # Published for curl and the OpenAPI document, not for the browser. The
      # dashboard reaches the api at /api on its OWN origin (localhost:3000),
      # which the web server answers by forwarding. An auth call made straight
      # to this port carries the wrong Origin and is refused, which is correct.
      - "3001:3001"
      - "9464:9464"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: docker.io/library/node:26-slim
    working_dir: /app
    command: sh -c "npm install && exec npx turbo run dev --filter=@repo/web"
    environment:
      # Two things read this. The web server's own SSR reads, which happen in
      # this container — so the address has to be one this container can reach,
      # not the one the browser uses — and the /api passthrough, which forwards
      # the browser's calls to the same place.
      #
      # The browser no longer needs an api address at all. It calls /api on
      # whatever origin it loaded the page from, which is why the VITE_* pair
      # that used to be here is gone — a build-time default for a value only the
      # server reads is what broke this stack in #2.
      API_URL: http://api:3001
      WEB_ORIGIN: http://localhost:3000
      METRICS_ENABLED: "true"
      # Error reporting, off unless SENTRY_DSN_WEB is in .env. Reads plain
      # SENTRY_DSN here; which project that is belongs to the deployment, and
      # for this one it is indexterity-web.
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    ports:
      # The one origin a browser uses, /api included. There was an nginx service
      # in front of this doing the ingress's /api split; the dashboard server
      # answers /api itself now (apps/web/src/lib/api-passthrough.ts), so the
      # container earned nothing but a second copy of the routing rule — in a
      # different proxy, with different buffering and header defaults, so it did
      # not reproduce the ingress either.
      - "3000:3000"
      - "9466:9464"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata18:
  api_node_modules:
  web_node_modules:
