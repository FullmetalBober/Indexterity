# Dev stack with hot reload. Postgres is the control-plane store.
# api/web run from bind-mounted source; per-service node_modules volumes keep
# native modules (musl/glibc) isolated from the host.
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mongo_optimizer
      POSTGRES_PASSWORD: mongo_optimizer
      POSTGRES_DB: mongo_optimizer
    ports:
      # Host 5433: 5432 is a common squatter target (another project's postgres
      # here); .env and the docs use localhost:5433 to match.
      - "5433:5432"
    volumes:
      # postgres:18+ keeps data in a version-specific subdirectory and refuses a
      # mount at the pre-18 /var/lib/postgresql/data. The volume is named for
      # its major version: a v17 directory is not readable by 18 without
      # pg_upgrade, so a bump gets a new volume and a dump/restore.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mongo_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local demo target to exercise the collector (NOT a customer cluster).
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: docker.io/library/node:26-slim
    working_dir: /app
    # `exec` so the real process becomes PID 1 and podman's SIGTERM reaches it.
    # Without it `sh` is PID 1, and a non-interactive shell does not forward
    # signals to the child it is waiting on — so every container ignored stop,
    # sat out the ten-second grace period, and was SIGKILLed (exit 137). That is
    # what breaks `down`: the teardown races the stragglers, pod and network
    # removal fail, and the next `up` reuses a container whose runtime state is
    # already gone ("cannot open .../exec.fifo").
    command: sh -c "npm install && exec npx turbo run dev --filter=@repo/api"
    environment:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@postgres:5432/mongo_optimizer
      API_PORT: "3001"
      # Dev targets live on the compose network; sign-up is open for convenience.
      ALLOW_PRIVATE_CLUSTER_TARGETS: "true"
      SIGNUP_MODE: open
      # The DASHBOARD's origin, not this container's port: better-auth appends
      # /api/auth itself, and the browser reaches all of it through the proxy on
      # 3000. It is also what the reset links in emails are built from.
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      # All three containers serve /metrics on 9464 and report different parts of
      # the picture, so each gets its own host port: api 9464, worker 9465,
      # web 9466.
      METRICS_ENABLED: "true"
    ports:
      # Published for curl and the OpenAPI document, not for the browser — the
      # dashboard reaches the api through the proxy, on the dashboard's origin.
      # An auth call made straight to this port carries the wrong Origin and is
      # refused, which is the point.
      - "3001:3001"
      - "9464:9464"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # One origin for the browser, the same shape the ingress gives production:
  # /api to the api, everything else to the dashboard. The relay the web server
  # used to run is gone, so this is what makes the session cookie first-party —
  # and it means `podman-compose up` is not a different topology from the chart.
  proxy:
    image: docker.io/library/nginx:1-alpine
    # nginx resolves both upstreams when it starts and exits if either name does
    # not resolve yet. depends_on orders the start but does not wait, so losing
    # that race has to be survivable rather than fatal.
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./deploy/compose/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - api
      - web

  web:
    image: docker.io/library/node:26-slim
    working_dir: /app
    command: sh -c "npm install && exec npx turbo run dev --filter=@repo/web"
    environment:
      WEB_PORT: "3000"
      # The web SERVER's own reads during SSR, which happen in this container —
      # so the address has to be one this container can reach, not the one the
      # browser uses. It goes straight to the api rather than back out through
      # the proxy: there is no cookie to make first-party server-side, only one
      # to forward.
      #
      # The browser no longer needs an api address at all. It calls /api on
      # whatever origin it loaded the page from, which is why the VITE_* pair
      # that used to be here is gone — a build-time default for a value only the
      # server reads is what broke this stack in #2.
      API_URL: http://api:3001
      WEB_ORIGIN: http://localhost:3000
      METRICS_ENABLED: "true"
    ports:
      # Not published on 3000: the proxy owns the browser-facing origin. This is
      # here for scrapes only.
      - "9466:9464"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  # Background worker: runs the cron schedule (collect/apply/finalize per cluster).
  worker:
    image: docker.io/library/node:26-slim
    working_dir: /app
    command: sh -c "npm install && npx turbo run build --filter=@repo/api^... && exec npm run worker -w @repo/api"
    environment:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@postgres:5432/mongo_optimizer
      MASTER_KEY: ${MASTER_KEY}
      ALLOW_PRIVATE_CLUSTER_TARGETS: "true"
      WORKER_CONCURRENCY: "2"
      METRICS_ENABLED: "true"
    ports:
      - "9465:9464"
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata18:
  mongodata:
  api_node_modules:
  web_node_modules:
  worker_node_modules:
