name: Release

# Tag-driven: `git tag v0.2.0 && git push --tags` publishes the three images and
# the chart, all versioned from that tag. Nothing publishes from main, so a
# merge can never move what someone's cluster pulls.
on:
  push:
    tags: ["v*"]
  # Publishing by hand, e.g. to re-cut a release after fixing a registry problem.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true

permissions:
  contents: read
  # ghcr.io is free for public packages, and GITHUB_TOKEN is enough to push to
  # it — no registry secret to rotate.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The smoke job below installs exactly what this one published.
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and owner
        id: meta
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          # ghcr rejects an uppercase path, and the account is FullmetalBober.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "publishing $version to ghcr.io/$owner"

      # A tag that names a version the tree does not carry would publish images
      # and a chart whose own metadata contradicts them.
      - name: Version in the tag must match the version in the tree
        run: npm run version:check -- "${{ steps.meta.outputs.version }}"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/indexterity-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/indexterity-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/indexterity-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/indexterity-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Both apps and a supervisor in one container, for a host that runs one
      # container per service and has no pods — and for the chart's
      # `topology: single-container`, where it is the only image the release
      # pulls. Published from the same tag as the other two, because a chart
      # version has to name images it was tested against whichever it points at.
      - name: Build and push the all-in-one image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/indexterity-all-in-one:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/indexterity-all-in-one:latest
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,scope=all-in-one,mode=max

      - uses: azure/setup-helm@v5

      - name: Package and push the chart
        run: |
          v="${{ steps.meta.outputs.version }}"
          # Chart version and appVersion both come from the tag, so a chart
          # release always names the images it was tested against.
          helm package deploy/helm/indexterity --version "$v" --app-version "$v" --destination /tmp
          helm push "/tmp/indexterity-$v.tgz" "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"

      - name: Summary
        run: |
          v="${{ steps.meta.outputs.version }}"
          owner="${{ steps.meta.outputs.owner }}"
          {
            echo "### Published \`$v\`"
            echo ""
            echo '```bash'
            echo "helm install indexterity oci://ghcr.io/$owner/charts/indexterity --version $v"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing successfully and publishing something that works are different
  # claims, and the job above only makes the first one. It would report success
  # for a chart whose appVersion names a tag that was never pushed, or for
  # packages left private — the install command in that summary would fail for
  # everyone and nothing here would know.
  #
  # So the release verifies itself: a throwaway Kind cluster installs the chart
  # and the images straight from ghcr.io, with no credentials, exactly as a
  # stranger would. Anonymous pulls make registry visibility part of the test.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    # Both packagings are published, so both are verified against the registry.
    # `split` proves indexterity-api and indexterity-web are public and boot;
    # `single-container` proves the same of indexterity-all-in-one, which is the
    # only image its topology pulls — a leg that never ran it would leave a
    # published image nothing had ever started.
    strategy:
      fail-fast: false
      matrix:
        topology: [split, single-container]
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: indexterity
          wait: 120s
      - uses: azure/setup-helm@v5
      - name: Install the published release
        run: deploy/kind-test.sh
        env:
          CTR: docker
          GHCR_OWNER: ${{ needs.publish.outputs.owner }}
          RELEASE: ${{ needs.publish.outputs.version }}
          TOPOLOGY: ${{ matrix.topology }}
