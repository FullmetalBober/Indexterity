name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A push that supersedes another one leaves the first run answering a question
# about a commit nobody is looking at any more, while holding the runner the new
# one is queued behind. That is not a rounding error here: `chart` builds two
# images and stands up a Kind cluster, and `e2e` plus three `integration` legs
# each bring up Postgres and Mongo, so a rapid succession of pushes to one pull
# request multiplies all of it for an answer no one reads.
#
# `main` and `dev` are exempt on purpose rather than by omission. Those runs are
# the record of whether an integration branch is sound, and a cancelled one
# leaves a commit with no verdict — so pushes there run to completion and only
# the pull_request runs collapse. Grouping by `github.ref` keeps the two kinds
# apart on their own: a push is `refs/heads/dev`, a pull request is
# `refs/pull/<n>/merge`, so neither can cancel the other.
#
# release.yml deliberately has none of this. It is tag-driven and publishes
# images and the chart to ghcr.io; cancelling a publish half way is how a chart
# ends up naming an image tag that was never pushed, which is the exact failure
# the RELEASE mode of kind-test.sh exists to catch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

# Three caches carry the work between runs, and they answer different questions.
#
#   ~/.npm         (setup-node)   what has been downloaded from the registry
#   node_modules   (this file)    what has been INSTALLED from those downloads
#   .turbo         (this file)    what has already been built, linted and tested
#
# The node_modules key has no restore-keys on purpose. A partial restore against
# a changed lockfile is the one failure mode worth designing out: it would leave
# a tree that neither matches the lockfile nor gets repaired, and the resulting
# breakage looks like a code bug. Exact match or a clean `npm ci`, nothing in
# between. The turbo cache is the opposite case — it is keyed by content
# internally, so a stale directory is safe and prefix-restoring it is free.
env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-check-${{ github.sha }}
          restore-keys: |
            turbo-check-
            turbo-
      - run: npm run lint
      - run: npm run version:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      # Advisories against the half of the tree that ships. Deliberately not a
      # bare `npm audit`: that counts the dev-server hole in drizzle-kit's
      # bundled esbuild the same as one in the HTTP router, and a gate that
      # fires on everything is a gate people learn to ignore. See the header of
      # scripts/audit-gate.ts for what is carried on purpose and why.
      #
      # In `check` rather than a job of its own because it needs the installed
      # tree and nothing else — a second job would re-run `npm ci` to read a
      # lockfile that is already sitting here.
      - run: npm run audit:gate

  # Every supported major, because version behaviour is load-bearing: the floor,
  # the $queryStats plan-metrics gate, and the profiler fallback below 8.0 are
  # each a different path through collectWorkload. Testing one version means the
  # other two can break silently — a cluster that quietly produces no
  # recommendations looks exactly like a cluster with nothing to recommend.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0", "8"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports:
          - "27017:27017"
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      MONGO_URL: mongodb://localhost:27017
      BETTER_AUTH_SECRET: integration-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      # Each matrix leg keeps its own key so three concurrent saves cannot race
      # for one, but they all fall back to whatever another leg or `check` last
      # wrote — the build is identical across them, only the server differs.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-int-${{ matrix.mongo }}-${{ github.sha }}
          restore-keys: |
            turbo-int-${{ matrix.mongo }}-
            turbo-
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:int -w @repo/api

  # The MSSQL adapter against real SQL Servers — its own job rather than extra
  # mongo-matrix legs, because that matrix would start the (heavy) mssql
  # container once per mongo version to run one file. Both supported series
  # run, because the tested ceiling (mssql/version.ts) is a promise this job
  # keeps: DISABLE/REBUILD semantics and the usage-stats reset have moved
  # between releases before. Adapter-level: no api is spawned, so postgres is
  # not needed; DATABASE_URL only satisfies the env schema.
  integration-mssql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mssql: ["2022-latest", "2025-latest"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Int3gration!Pass"
        ports:
          - "1433:1433"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Int3gration!Pass' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      DATABASE_URL: postgres://unused:unused@localhost:5432/unused
      MSSQL_URL: "mssql://sa:Int3gration%21Pass@localhost:1433?trustservercertificate=true"
      BETTER_AUTH_SECRET: integration-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npm run test:int -w @repo/api -- integration/mssql.int.test.ts

  # The only layer that exercises browser -> web server -> api -> postgres/mongo.
  # It caught the session-cookie relay double-encoding every request after
  # sign-in, which no unit or api test could see: each side was correct on its
  # own and the defect lived in the hand-off.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports:
          - "27017:27017"
      # A second mongod, with authentication on and a user that can create users.
      # The one above has auth disabled, which is the single state where the
      # scoped-user offer cannot appear whatever the code does — so the consent
      # path from D15 had no coverage anywhere (#86). The root user this creates
      # carries userAdminAnyDatabase, which is what the offer is gated on.
      mongo-auth:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: e2e-root
        ports:
          - "27018:27017"
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      MONGO_URL: mongodb://localhost:27017
      MONGO_ADMIN_URL: mongodb://root:e2e-root@localhost:27018
      BETTER_AUTH_SECRET: e2e-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      # The browser download is the cacheable half. Its system libraries are apt
      # packages on the runner image and cannot be, so a hit still runs
      # install-deps — seconds against the download's tens of them.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ github.sha }}
          restore-keys: |
            turbo-e2e-
            turbo-
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:e2e -w @repo/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # OWASP ZAP, passive, against the origin a browser actually gets.
  #
  # Passive only — the baseline scan spiders and reads, it does not attack. That
  # is not timidity: an active scan against this app would submit forms as an
  # authenticated owner, and the things it would find its way to are `connect a
  # cluster` and `apply a recommendation`. Deciding to run one is deciding what it
  # is allowed to touch, which is a separate piece of work (#21).
  #
  # The target is the DASHBOARD's port, not the api's, because that is the whole
  # surface: the web server answers /api itself (src/lib/api-passthrough.ts), so
  # one origin covers documents, assets and the api alike — the same shape a
  # browser sees in production, minus the proxy.
  #
  # No mongo service. The scan signs in to nothing and connects no cluster, so
  # the only backing store either process opens is postgres.
  zap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      BETTER_AUTH_SECRET: zap-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # One origin, the dashboard's. Both servers have to agree on it: the api
      # builds better-auth's URLs from it and checks Origin against it, and the
      # dashboard forwards /api to the api's own port server-side.
      WEB_ORIGIN: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      API_PORT: "3001"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-zap-${{ github.sha }}
          restore-keys: |
            turbo-zap-
            turbo-
      - run: npm run build
      - run: npm run db:migrate

      # Started by hand rather than through playwright's webServer, because the
      # scanner is not a test run: the servers have to outlive the step that
      # starts them. Logs go to files so a scan that fails on a 500 can be told
      # apart from one that fails on a header.
      - name: boot the api and the dashboard
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          PORT=3000 API_URL=http://127.0.0.1:3001 \
            node apps/web/.output/server/index.mjs > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null \
               && curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "both up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stack did not come up in 60s"
          echo "--- api ---"; cat /tmp/api.log
          echo "--- web ---"; cat /tmp/web.log
          exit 1

      # Sign in, so the scan sees the product rather than its front door.
      #
      # Without this the spider reached thirteen URLs — `/`, `/app` rendering the
      # sign-in screen, `/reset-password`, robots, sitemap and the assets — and
      # every authenticated page, which is where a tenant's data is, went
      # unscanned. The alerts that matter most are only reachable here: whether an
      # authenticated document says no-store, whether the session cookie carries
      # the flags it should, whether a cluster name or an org id leaks into a URL.
      #
      # `SIGNUP_MODE` is deliberately NOT set. The default is invite-only and the
      # FIRST account always bootstraps an install, so a fresh service-container
      # database lets this through on the same posture a real deployment runs —
      # switching to `open` would scan a configuration nobody deploys.
      #
      # The organization matters as much as the account: without one the dashboard
      # draws a create-org screen and nothing below it, so the pages worth scanning
      # would still not exist. No cluster is connected — that needs a mongod and
      # would have the scanner dialling a database, which is a bigger decision than
      # this job should make on its own.
      - name: sign in, so the scan reaches the dashboard
        run: |
          set -euo pipefail
          cookies() { grep -i '^set-cookie:' "$1" | sed -E 's/^[Ss]et-[Cc]ookie: *//' | cut -d';' -f1 | paste -sd'; ' -; }

          curl -fsS -D /tmp/signup.h -o /tmp/signup.json \
            -X POST http://127.0.0.1:3001/api/auth/sign-up/email \
            -H 'content-type: application/json' -H "origin: $WEB_ORIGIN" \
            -d '{"email":"zap@scan.invalid","password":"scanner-password-12345","name":"ZAP"}'
          COOKIE="$(cookies /tmp/signup.h)"
          if [ -z "$COOKIE" ]; then
            echo "::error::sign-up returned no session cookie"; cat /tmp/signup.json; exit 1
          fi
          # Never let the session reach a log, even though the whole stack dies
          # with the job.
          echo "::add-mask::$COOKIE"

          curl -fsS -o /tmp/org.json \
            -X POST http://127.0.0.1:3001/api/auth/organization/create \
            -H 'content-type: application/json' -H "origin: $WEB_ORIGIN" -H "cookie: $COOKIE" \
            -d '{"name":"ZAP Scan Org","slug":"zap-scan-org"}'

          # The action forwards these three into the container with a bare `-e`,
          # so they have to be in the job environment by the time it runs. ZAP
          # then sets the header on every request to the named site — the default
          # header is Authorization, and this app authenticates by cookie.
          {
            echo "ZAP_AUTH_HEADER=Cookie"
            echo "ZAP_AUTH_HEADER_VALUE=$COOKIE"
            echo "ZAP_AUTH_HEADER_SITE=127.0.0.1"
          } >> "$GITHUB_ENV"

          # Proof the session works before handing it to the scanner. A cookie that
          # has silently stopped authenticating would produce a clean scan of the
          # sign-in page — passing, and meaning nothing.
          #
          # Asked of the api rather than the dashboard, deliberately. `/api/org`
          # answers 200 with the org for a resolved session and 401 "sign in
          # required" without one, which is exactly the question being asked. The
          # obvious alternative — following /app and checking where it lands — also
          # works but couples the check to routing: /app redirects to a real route
          # only once the session resolves an organization, so it would answer "not
          # authenticated" for a state that is authenticated. Both were measured
          # against the built servers before choosing.
          STATUS="$(curl -sS -o /tmp/org.json -w '%{http_code}' -H "cookie: $COOKIE" http://127.0.0.1:3001/api/org)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::the session cookie does not authenticate — /api/org answered $STATUS"
            cat /tmp/org.json
            exit 1
          fi
          echo "signed in, organization created, /api/org answers 200"

      # `--network=host` is the action's own default, so 127.0.0.1 inside the ZAP
      # container is the runner's loopback and the servers above are reachable.
      #
      # allow_issue_writing is off deliberately. On, this opens and rewrites a
      # GitHub issue on every run, which turns the repo's issue list into a scan
      # log; the report is uploaded as an artefact instead, and a real finding is
      # worth someone filing by hand.
      #
      # fail_action is ON. A scan that cannot fail is a report nobody is obliged
      # to read — and .zap/rules.tsv is where an alert we have decided about goes,
      # with the reason next to it, so silence is always something someone wrote.
      #
      # `-j` is the browser-driven spider, and it is not optional here. **The
      # dashboard's pages contain no `href` at all** — measured on the built
      # output, signed in and signed out, zero in both — because TanStack Router
      # navigates on the client. So the traditional spider, which reads HTML and
      # follows links, cannot discover a single route beyond the entry page: it is
      # what left the first runs scanning thirteen URLs, none of them the product.
      # A browser that runs the bundle finds what a user would.
      #
      # It is still a PASSIVE scan. The spider drives the app as a signed-in owner
      # and ZAP reads the responses; nothing injects a payload, which is the line
      # #21 drew and this stays on the right side of. What the browser can reach is
      # bounded on purpose: no cluster is connected, so there is nothing to
      # disconnect or drop, and deleting the organization needs its name typed into
      # a confirm dialog. The database is a service container that dies with the
      # job either way.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: -j
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline

      - name: server logs
        if: always()
        run: |
          echo "--- api ---"; cat /tmp/api.log || true
          echo "--- web ---"; cat /tmp/web.log || true
          kill "$(cat /tmp/api.pid)" "$(cat /tmp/web.pid)" 2>/dev/null || true

  # Does this change touch what the chart job tests?
  #
  # That job was main-only, on the grounds that two image builds per PR cost
  # more than they catch. True of a PR that moves a React component; false of
  # one that rewrites how the images are built — and the second kind was
  # sailing through review with its riskiest job skipped, then running for the
  # first time on main. The rule is the same rule, applied to the diff instead
  # of the branch.
  #
  # The filter widened once already. #172 rewired `startWorker`, `main.ts` and
  # every job entrypoint, and this job said `chart=false` — packaging paths were
  # the whole filter, and how the api boots is not a packaging path. The only
  # reason that shipped safely is that both Kind topologies were run by hand.
  # Nothing else in CI covers it: the integration suite calls the job functions
  # directly, so it never sees `startWorker`, the crontab installing, or a
  # supervisor's view of a process that dies at boot (#177).
  #
  # Those paths get BOTH legs, because the two topologies differ in exactly the
  # way that matters here — `worker.enabled` (see kind-test.sh):
  #
  #   split             worker.enabled=true   the standalone worker.ts Deployment
  #   single-container  api.runWorker=true    the embedded runner, no worker.ts
  #
  # So a job-pipeline change has two kubelet-visible shapes: `worker.ts` as its
  # own process, and `main.ts` running the runner inside the api. Both legs run on
  # every path that reaches this job, so the matrix below is a literal rather than
  # something this job has to decide.
  scope:
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.diff.outputs.chart }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(deploy/|apps/[a-z]+/Dockerfile|\.github/workflows/ci\.yml)|^apps/api/src/(jobs/|main\.ts|worker\.ts)'; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart=false" >> "$GITHUB_OUTPUT"
          fi

  # Installs the chart into a throwaway Kind cluster. `helm lint` renders YAML;
  # this one finds out whether the release actually installs, which is a
  # different question and the one that kept being answered wrong.
  chart:
    needs: scope
    if: needs.scope.outputs.chart == 'true'
    runs-on: ubuntu-latest
    # One leg per packaging (see `topology` in values.yaml). The same assertions
    # run against both, which is the only way to hold the claim they are meant to
    # hold: that the api and the dashboard are reachable at the same Service
    # names, with the same ports, however many pods and containers they were
    # folded into. Legs run in parallel, and each builds only the images its
    # topology pulls — split the api and web pair, single-container the all-in-one
    # on its own.
    strategy:
      fail-fast: false
      matrix:
        topology: [split, single-container]
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: indexterity
          wait: 120s
      - uses: azure/setup-helm@v5

      # The alert rules cannot be exercised by the Kind install — that needs the
      # Prometheus Operator CRDs — and a rule with a typo'd expression installs
      # cleanly and then never fires, which is the worst failure available to a
      # monitoring change. promtool parses every expression instead.
      # Once, not once per topology: the rules are the same document in both
      # (they select on component labels, which the Services keep either way).
      - name: alert rules must parse
        if: matrix.topology == 'split'
        run: |
          helm template rel deploy/helm/indexterity \
            --set secrets.databaseUrl=p --set secrets.betterAuthSecret=s \
            --set secrets.masterKey=k --set config.allowInsecureAuthUrl=true \
            --set metrics.enabled=true --set metrics.prometheusRule.enabled=true \
            | python3 -c "
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if doc and doc.get('kind') == 'PrometheusRule':
                  yaml.safe_dump({'groups': doc['spec']['groups']}, open('rules.yaml', 'w'), sort_keys=False)
                  break
          else:
              raise SystemExit('no PrometheusRule rendered')
          "
          docker run --rm --entrypoint promtool -v "$PWD/rules.yaml:/rules.yaml:ro" \
            prom/prometheus:v3.6.0 check rules /rules.yaml

      # The two builds were this workflow's longest step by a wide margin, and
      # entirely uncached — every run reinstalled every dependency inside both
      # images from scratch. buildx with the GitHub cache backend reuses the
      # layers instead, and `scope` is set to the same names the release
      # workflow uses so the two warm each other rather than keeping separate
      # copies of identical layers.
      #
      # Built here rather than inside kind-test.sh because that script has no
      # business knowing about buildx: it takes the images as given (PREBUILT)
      # and gets on with testing the chart.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        if: matrix.topology != 'single-container'
        with:
          context: .
          file: apps/api/Dockerfile
          tags: indexterity/api:0.1.0
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        if: matrix.topology != 'single-container'
        with:
          context: .
          file: apps/web/Dockerfile
          tags: indexterity/web:0.1.0
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # The all-in-one image builds both apps, so it shares no layers with either
      # of the two above — its own cache scope, same name the release workflow
      # uses so the two warm each other.
      - uses: docker/build-push-action@v7
        if: matrix.topology == 'single-container'
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          tags: indexterity/all-in-one:0.1.0
          load: true
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,scope=all-in-one,mode=max

      - run: deploy/kind-test.sh
        env:
          CTR: docker
          PREBUILT: "1"
          TOPOLOGY: ${{ matrix.topology }}
