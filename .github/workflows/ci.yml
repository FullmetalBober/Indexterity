name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run version:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test

  # Every supported major, because version behaviour is load-bearing: the floor,
  # the $queryStats plan-metrics gate, and the profiler fallback below 8.0 are
  # each a different path through collectWorkload. Testing one version means the
  # other two can break silently — a cluster that quietly produces no
  # recommendations looks exactly like a cluster with nothing to recommend.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0", "8"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports:
          - "27017:27017"
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      MONGO_URL: mongodb://localhost:27017
      BETTER_AUTH_SECRET: integration-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:int -w @repo/api

  # The only layer that exercises browser -> web server -> api -> postgres/mongo.
  # It caught the session-cookie relay double-encoding every request after
  # sign-in, which no unit or api test could see: each side was correct on its
  # own and the defect lived in the hand-off.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports:
          - "27017:27017"
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      MONGO_URL: mongodb://localhost:27017
      BETTER_AUTH_SECRET: e2e-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:e2e -w @repo/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Installs the chart into a throwaway Kind cluster. On main only — it builds
  # both images, so per-PR would cost more than it catches. `helm lint` renders
  # YAML; this one finds out whether the release actually installs, which is a
  # different question and the one that kept being answered wrong.
  chart:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: indexterity
          wait: 120s
      - uses: azure/setup-helm@v4
      - run: deploy/kind-test.sh
        env:
          CTR: docker
