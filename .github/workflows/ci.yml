name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Three caches carry the work between runs, and they answer different questions.
#
#   ~/.npm         (setup-node)   what has been downloaded from the registry
#   node_modules   (this file)    what has been INSTALLED from those downloads
#   .turbo         (this file)    what has already been built, linted and tested
#
# The node_modules key has no restore-keys on purpose. A partial restore against
# a changed lockfile is the one failure mode worth designing out: it would leave
# a tree that neither matches the lockfile nor gets repaired, and the resulting
# breakage looks like a code bug. Exact match or a clean `npm ci`, nothing in
# between. The turbo cache is the opposite case — it is keyed by content
# internally, so a stale directory is safe and prefix-restoring it is free.
env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-check-${{ github.sha }}
          restore-keys: |
            turbo-check-
            turbo-
      - run: npm run lint
      - run: npm run version:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test

  # Every supported major, because version behaviour is load-bearing: the floor,
  # the $queryStats plan-metrics gate, and the profiler fallback below 8.0 are
  # each a different path through collectWorkload. Testing one version means the
  # other two can break silently — a cluster that quietly produces no
  # recommendations looks exactly like a cluster with nothing to recommend.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0", "8"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports:
          - "27017:27017"
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      MONGO_URL: mongodb://localhost:27017
      BETTER_AUTH_SECRET: integration-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      # Each matrix leg keeps its own key so three concurrent saves cannot race
      # for one, but they all fall back to whatever another leg or `check` last
      # wrote — the build is identical across them, only the server differs.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-int-${{ matrix.mongo }}-${{ github.sha }}
          restore-keys: |
            turbo-int-${{ matrix.mongo }}-
            turbo-
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:int -w @repo/api

  # The only layer that exercises browser -> web server -> api -> postgres/mongo.
  # It caught the session-cookie relay double-encoding every request after
  # sign-in, which no unit or api test could see: each side was correct on its
  # own and the defect lived in the hand-off.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mongo_optimizer
          POSTGRES_PASSWORD: mongo_optimizer
          POSTGRES_DB: mongo_optimizer
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mongo_optimizer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports:
          - "27017:27017"
    env:
      DATABASE_URL: postgres://mongo_optimizer:mongo_optimizer@localhost:5432/mongo_optimizer
      MONGO_URL: mongodb://localhost:27017
      BETTER_AUTH_SECRET: e2e-secret
      MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - uses: actions/cache@v6
        id: modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      # The browser download is the cacheable half. Its system libraries are apt
      # packages on the runner image and cannot be, so a hit still runs
      # install-deps — seconds against the download's tens of them.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ github.sha }}
          restore-keys: |
            turbo-e2e-
            turbo-
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:e2e -w @repo/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Does this change touch what the chart job tests?
  #
  # That job was main-only, on the grounds that two image builds per PR cost
  # more than they catch. True of a PR that moves a React component; false of
  # one that rewrites how the images are built — and the second kind was
  # sailing through review with its riskiest job skipped, then running for the
  # first time on main. The rule is the same rule, applied to the diff instead
  # of the branch.
  scope:
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.diff.outputs.chart }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(deploy/|apps/[a-z]+/Dockerfile|\.github/workflows/ci\.yml)'; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart=false" >> "$GITHUB_OUTPUT"
          fi

  # Installs the chart into a throwaway Kind cluster. `helm lint` renders YAML;
  # this one finds out whether the release actually installs, which is a
  # different question and the one that kept being answered wrong.
  chart:
    needs: scope
    if: needs.scope.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: indexterity
          wait: 120s
      - uses: azure/setup-helm@v5

      # The alert rules cannot be exercised by the Kind install — that needs the
      # Prometheus Operator CRDs — and a rule with a typo'd expression installs
      # cleanly and then never fires, which is the worst failure available to a
      # monitoring change. promtool parses every expression instead.
      - name: alert rules must parse
        run: |
          helm template rel deploy/helm/indexterity \
            --set secrets.databaseUrl=p --set secrets.betterAuthSecret=s \
            --set secrets.masterKey=k --set config.allowInsecureAuthUrl=true \
            --set metrics.prometheusRule.enabled=true \
            | python3 -c "
          import sys, yaml
          for doc in yaml.safe_load_all(sys.stdin):
              if doc and doc.get('kind') == 'PrometheusRule':
                  yaml.safe_dump({'groups': doc['spec']['groups']}, open('rules.yaml', 'w'), sort_keys=False)
                  break
          else:
              raise SystemExit('no PrometheusRule rendered')
          "
          docker run --rm --entrypoint promtool -v "$PWD/rules.yaml:/rules.yaml:ro" \
            prom/prometheus:v3.6.0 check rules /rules.yaml

      # The two builds were this workflow's longest step by a wide margin, and
      # entirely uncached — every run reinstalled every dependency inside both
      # images from scratch. buildx with the GitHub cache backend reuses the
      # layers instead, and `scope` is set to the same names the release
      # workflow uses so the two warm each other rather than keeping separate
      # copies of identical layers.
      #
      # Built here rather than inside kind-test.sh because that script has no
      # business knowing about buildx: it takes the images as given (PREBUILT)
      # and gets on with testing the chart.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: indexterity/api:0.1.0
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          tags: indexterity/web:0.1.0
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - run: deploy/kind-test.sh
        env:
          CTR: docker
          PREBUILT: "1"
