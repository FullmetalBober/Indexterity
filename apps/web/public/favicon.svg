<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Indexterity">
  <rect width="32" height="32" rx="7" fill="#00684A"/>
  <!-- three index bars, the shortest one hidden (dimmed) before its drop -->
