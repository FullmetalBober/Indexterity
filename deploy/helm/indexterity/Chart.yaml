apiVersion: v2
name: indexterity
description: Indexterity — automatic MongoDB index management (api, dashboard, worker)
type: application
# Chart version — bump on chart changes. The annotations are release-please's
# (`generic` updater): a line-wise replacement, because the `yaml` updater
# round-trips the document through a parser and drops every comment in the file
# along with appVersion's quotes.
version: 0.11.0 # x-release-please-version
# Application version — the default image tag.
appVersion: "0.11.0" # x-release-please-version
home: https://github.com/FullmetalBober/Indexterity
sources:
  - https://github.com/FullmetalBober/Indexterity
keywords:
  - mongodb
  - indexes
  - database
  - optimization
maintainers:
  - name: Indexterity
