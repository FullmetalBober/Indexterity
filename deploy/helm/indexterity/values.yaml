# Indexterity Helm values. The three workloads (api, web, worker) come from two
# images; PostgreSQL is NOT bundled — point databaseUrl at a managed instance or
# your own postgres release.
#
#   helm install indexterity oci://ghcr.io/fullmetalbober/charts/indexterity \
#     --set secrets.databaseUrl=... --set secrets.betterAuthSecret=... \
#     --set secrets.masterKey=... --set web.publicUrl=https://...
#
# The image tags default to the chart's appVersion, which the release workflow
# sets from the same tag that built them — so a chart version always names the
# images it was tested against.

nameOverride: ""
fullnameOverride: ""

# Applied to every pod. Useful for imagePullSecrets and a shared registry.
global:
  imagePullSecrets: []

api:
  image:
    repository: ghcr.io/fullmetalbober/indexterity-api
    # Defaults to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3001
  service:
    type: ClusterIP
    port: 3001
    annotations: {}
  # Reached two ways: by the browser, through the ingress at /api on the
  # dashboard's host (this is what keeps the session cookie first-party), and by
  # the web pods over this Service for server-side rendering. ingress.api below
  # adds a second hostname, and is only for callers outside the browser.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Run the job runner inside the api process instead of a separate worker
  # container, for a small single-replica install that sets worker.enabled=false.
  # Keep it false otherwise: with the worker Deployment on, or with more than one
  # api replica, the cron schedule would be installed more than once.
  runWorker: false
  # Extra environment variables (name/value pairs).
  extraEnv: []

web:
  image:
    repository: ghcr.io/fullmetalbober/indexterity-web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3000
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  # The dashboard's own public origin. REQUIRED when ingress is enabled: the api
  # trusts it for auth requests and session cookies are stored against it.
  publicUrl: ""
  # Where the WEB SERVER reaches the api, for its own server-side rendering.
  # Defaults to the in-cluster Service. Not what the browser uses — that is
  # /api on publicUrl, routed by the ingress.
  apiUrl: ""
  # Overrides the canonical URL in the landing page's SEO tags (canonical,
  # og:url, og:image). Leave empty to keep the product's own public domain —
  # set it when running a fork or a separately-indexed staging copy.
  siteUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

worker:
  # Runs the cron schedule (collect, apply, finalize, retention, digest).
  # Keep at ONE replica: graphile-worker coordinates through Postgres, but the
  # crontab would otherwise be scheduled by every pod.
  enabled: true
  concurrency: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# Prometheus metrics on a second port, served by all three workloads. Never
# routed by the ingress and carrying no auth: queue depth, cluster counts and
# pipeline state are operator information, so the endpoint is reachable
# in-cluster only until you deliberately expose it.
#
# Each workload answers for what only it can see, so scrape all three:
#   api     HTTP traffic, and everything read from the control-plane database —
#           clusters, recommendations by state, queue depth, dead-letter backlog
#   worker  job outcomes and durations, the regression gate, drops executed, and
#           which clusters it currently cannot reach
#   web     page render time per route, and the api as the dashboard server
#           experiences it (including "never answered")
metrics:
  enabled: true
  port: 9464
  # A Prometheus Operator ServiceMonitor per workload. Needs the
  # monitoring.coreos.com CRDs — off by default because a chart that assumes
  # them fails to install on a cluster that scrapes some other way.
  serviceMonitor:
    enabled: false
    # Extra labels, for an Operator that selects ServiceMonitors by label.
    labels: {}
    interval: 30s
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
  # Alerting rules for the failures that are otherwise silent: a schedule that
  # stopped running, a worker that is gone, observation being thrown away, the api
  # having lost Postgres. Same CRD requirement as the ServiceMonitor, so also off
  # by default.
  #
  # The stale-schedule windows come from the crontab in jobs/runner.ts — change
  # one there and the matching threshold here has to move with it.
  prometheusRule:
    enabled: false
    # Extra labels, for an Operator that selects PrometheusRules by label.
    labels: {}
    thresholds:
      # A runnable job no worker has claimed for this long. `apply` and `probe`
      # tick every five minutes, so fifteen means the worker is down or saturated.
      queueAgeSeconds: 900
      # Permanently failed jobs sitting in the queue. Retention prunes them after
      # a window, so a standing pile is real rather than history.
      deadLetterBacklog: 5
      # Fraction of the fleet unreachable at once. One cluster is the customer's
      # problem and they have already been emailed; half of them is ours.
      unreachableFleetRatio: 0.5
      # Auth 429s per second. Either a brute-force attempt or a real customer
      # behind NAT hitting the shared budget — both want a human.
      authRateLimited: 0.5
      # Regression gate rejections per day before it stops looking like bad luck
      # and starts looking like the engine proposing bad drops.
      regressionsPerDay: 3

# Error reporting to Sentry, from all three workloads. The other half of the
# picture above: the metrics say how OFTEN something failed, an error says WHAT
# failed and where. The worker is the reason this exists — a job that throws
# there is invisible unless somebody happens to be reading container logs at the
# time.
#
# Off unless you set a DSN, and the DSN is YOURS. This install reports to your
# Sentry organisation (or to a self-hosted Sentry), never to ours.
#
# What is sent is scrubbed before it leaves the pod: MongoDB and Postgres URIs
# are removed whole — hosts included, since a replica set's member list is your
# infrastructure — along with the credentials of any other URI and any field
# named like a secret. That runs on every event, breadcrumb and request body, and
# is unit-tested in packages/errors. Nothing here sends metrics or traces: the
# scrape endpoint above stays the only source of those.
errorReporting:
  # The api AND the worker report here. One project for the two of them on
  # purpose: they are one image, one release and one body of code — a fault in
  # the job or analysis layer is reachable from both, so a project per workload
  # would file it twice — and RUN_WORKER=true makes them one process anyway.
  # A `service` tag says which one answered.
  #
  # https://<key>@<org>.ingest.<region>.sentry.io/<project>
  dsn: ""
  # The dashboard server, which is a separate app with a separate release and
  # nothing shared with the api but the contract. Leave empty to send it to the
  # same project as the api.
  webDsn: ""
  # Which deployment an event came from. Staging and production must not share
  # an issue stream, and NODE_ENV calls both of them "production". Defaults to
  # the release namespace.
  environment: ""

# Runs `node dist/migrate.js` as a pre-install/pre-upgrade hook, before any new
# pod starts. Disable only if you apply migrations out of band.
migrations:
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

config:
  logLevel: info
  # Reject sign-ins from unverified addresses (needs working SMTP).
  requireEmailVerification: false
  # Demand a second factor of owners before any owner-only mutation. False by
  # default so a fresh install can bootstrap its first account, but a hosted
  # deployment should turn it on: owner accounts can flip customers' clusters
  # live. GitHub sign-ins are exempt (their provider enforces its own).
  requireOwnerTwoFactor: false
  # Who may create an account:
  #   invite — default. The first account bootstraps the install; after that an
  #            address needs a pending invite from an owner.
  #   open   — anyone. Only for a deliberately public instance: the control
  #            plane dials customer-supplied hosts, so an open front door hands
  #            that reach to strangers.
  #   closed — nobody new.
  signupMode: invite
  # Allow connecting clusters on private/loopback addresses. Self-hosted
  # installs whose MongoDB sits on the same private network need this; a hosted
  # install must leave it false, or any account can probe the internal network.
  # Cloud metadata and other never-a-database ranges stay blocked either way.
  allowPrivateClusterTargets: false
  # Allow connecting clusters that do not offer validated TLS. Every outbound
  # connection requires it by default, including the ones the worker makes from
  # stored credentials — so a cluster connected without it stops being collected
  # and its owners are told why.
  #
  # Deliberately NOT part of allowPrivateClusterTargets above: a VPC-peered or
  # PrivateLink cluster is a private address that must still be forced to TLS,
  # so coupling a transport rule to an addressing rule would quietly weaken the
  # installs that most look like they need the exception. Set this only when the
  # MongoDB you manage genuinely serves no certificate and the network between
  # is trusted.
  allowInsecureClusterTls: false
  # Allow connecting clusters running a MongoDB major series newer than the one
  # this release was tested against. The floor is not overridable; this is the
  # ceiling. Refusing rather than guessing is the default because the engine
  # hides, drops and builds indexes on a live database, and a major release is
  # where command behaviour moves.
  allowUntestedMongoVersion: false
  # The operator's retention ceiling, in days. Storage is your bill, so this caps
  # what any plan keeps AND what any plan may see. Empty means no ceiling — each
  # plan's own window decides.
  retentionDays: ""
  # Per-IP request budgets, per minute. Raise them for a shared egress IP or a
  # test suite. Read rateLimitMax as PER REPLICA (see the api Deployment);
  # authRateLimitMax is read twice — Fastify applies it per replica to
  # /api/auth/*, and better-auth applies it to the credential endpoints counting
  # in Postgres, so that half is the whole deployment's budget.
  rateLimitMax: 300
  authRateLimitMax: 20
  # Whether a trusted proxy sits in front of the api. Behind an ingress or a
  # Service, every request arrives from the proxy, so the per-IP rate limits
  # collapse into one shared bucket unless the forwarded address is trusted.
  # Empty = decide from ingress.enabled. "true", a hop count ("1"), or a CIDR
  # list are all accepted. Leave it off when the api is directly exposed:
  # trusting a forwarded header then lets any client forge an address.
  #
  # Prefer the CIDR list. better-auth counts the auth limits per client address
  # too — in Postgres, so across replicas — and it accepts only ranges: with
  # "true" it believes X-Forwarded-For only when the header holds a single
  # address, which it does not once an ingress has added itself. The auth limits
  # then apply to everybody together rather than per client. The pod network's
  # range is the usual answer here (10.0.0.0/8 on most clusters).
  trustProxy: ""
  # The plan a newly created organization lands on.
  #
  # SELF_HOSTED is the BUSL Additional Use Grant expressed as entitlements: one
  # connected cluster, and everything else on. The licence caps production
  # clusters and says nothing about features, seats or history — so neither does
  # this. Shipping the hosted FREE tier here would restrict you further than the
  # licence you are complying with, on hardware you are paying for yourself.
  #
  # It is not a security control and is not pretending to be one: anyone who
  # owns the database can change it. The licence is what binds; this only keeps
  # the software from quietly inviting you past the grant. Hold a commercial
  # licence for more clusters? Set the plan with set-plan.js.
  defaultOrgPlan: SELF_HOSTED
  # Storage price used for the $/month ROI headline.
  storageUsdPerGbMonth: ""
  # The origin better-auth signs sessions for. Defaults to the dashboard's own
  # public origin (web.publicUrl, or the ingress host), which is where the
  # session cookie actually lives — the browser never reaches the api directly.
  betterAuthUrl: ""
  # Allow a non-https auth URL. The api refuses one in production because the
  # session cookie's Secure flag depends on it, so this is ONLY for a cluster
  # that terminates no TLS anywhere — a Kind or minikube smoke test. Never set
  # it on anything a browser reaches over the network.
  allowInsecureAuthUrl: false

secrets:
  # Bring your own Secret instead of the values below. It must contain:
  # DATABASE_URL, BETTER_AUTH_SECRET, MASTER_KEY (and optionally SMTP_PASS,
  # GITHUB_CLIENT_SECRET).
  existingSecret: ""
  # postgres://user:pass@host:5432/indexterity
  databaseUrl: ""
  # Session signing key: openssl rand -base64 32
  betterAuthSecret: ""
  # KEK for envelope-encrypted cluster credentials: openssl rand -base64 32
  # LOSING THIS MAKES EVERY STORED CONNECTION STRING UNREADABLE — back it up.
  masterKey: ""
  # Bump alongside adding MASTER_KEY_V<n> to rotate the KEK.
  masterKeyVersion: ""
  github:
    clientId: ""
    clientSecret: ""

# Outbound mail: invites, regression alerts, verification and reset links.
# Without a host, sending is a logged no-op.
smtp:
  host: ""
  port: 465
  user: ""
  password: ""
  from: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  # The dashboard's host. Must match web.publicUrl.
  host: ""
  tls:
    enabled: false
    secretName: ""
  # Expose the api under a second host for programmatic access. Not needed for
  # the dashboard to work.
  api:
    enabled: false
    host: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Left false by default: the node runtime writes to /tmp. Set true and mount
  # an emptyDir at /tmp if your policy requires it.
  readOnlyRootFilesystem: false
