# Indexterity Helm values. The three workloads (api, web, worker) come from two
# images; PostgreSQL is NOT bundled — point databaseUrl at a managed instance or
# your own postgres release.
#
#   helm install indexterity oci://ghcr.io/fullmetalbober/charts/indexterity \
#     --set secrets.databaseUrl=... --set secrets.betterAuthSecret=... \
#     --set secrets.masterKey=... --set web.publicUrl=https://...
#
# The image tags default to the chart's appVersion, which the release workflow
# sets from the same tag that built them — so a chart version always names the
# images it was tested against.

nameOverride: ""
fullnameOverride: ""

# A note on the memory numbers throughout this file, because they are lower than
# a Node service's reputation suggests and the reason is worth knowing before you
# raise one.
#
# **V8 sizes its heap from the container's limit, not the host's memory.** It
# takes roughly half of it as the old-space ceiling and grows into that ceiling
# happily, collecting only when it approaches it — so RSS follows the limit
# rather than the workload. The same api image measured 228 MB idle on a 16 GB
# machine with no limit, and 104 MB under a 512 MiB one. Both are the same
# process doing the same nothing.
#
# Three consequences:
#   - Raising a limit raises usage. A limit is a target, not just a ceiling, so
#     "give it more headroom to be safe" is how a 128 MB service becomes a 512 MB
#     one. Raise it when something is actually OOMKilled.
#   - **That sizing stops scaling below 512 MiB**, which is where these numbers
#     sit. Measured on node 26, the default ceiling flattens at ~262 MB: a 256 MiB
#     limit, a 192 MiB one and a 96 MiB one all produce it. So under a small limit
#     a process believes it may hold more heap than the cgroup allows, and is
#     OOMKilled where it should have collected. The chart therefore caps each
#     container's heap at 65% of that container's OWN limit, which is why changing
#     a limit below is enough — nothing has to be kept in step by hand. Put
#     NODE_OPTIONS in extraEnv to override it.
#   - The requests below are near measured steady state and the limits leave room
#     for bursts, of which the sharp one is **password hashing**: scrypt is
#     memory-hard by design and allocates roughly 32 MB per hash IN FLIGHT, so a
#     handful of simultaneous sign-ins is tens of megabytes that steady-state
#     observation never shows. config.authRateLimitMax bounds the rate but not
#     the concurrency, so the limit has to absorb it.
#
# Measured under load — page renders, api calls and concurrent sign-ups — against
# the published images. They are floors for an install with a small fleet: the
# collectors hold per-collection statistics while they work, so an api and a
# worker managing many clusters will sit higher. Watch
# container_memory_working_set_bytes on your own install before tightening
# further.

# How the workloads are PACKAGED. The code is identical in both; this only
# decides how many Deployments and containers it lands in.
#
#   split             Three Deployments from two images. The default, and what a
#                     hosted install runs: api, web and worker roll, scale and
#                     fail independently, so an api rollout cannot take the
#                     landing page down with it.
#
#   single-container  One Deployment, ONE container, from the all-in-one image
#                     below: both processes under a supervisor that is PID 1.
#                     This is the one for a host that runs a single container per
#                     service and has no pods at all — Fly, Render, Cloud Run,
#                     Docker Compose, `docker run`. The image is usable entirely
#                     without this chart.
#
# Neither folds in the WORKER: that is worker.enabled and api.runWorker below,
# and it is a separate decision because it changes what runs on a schedule rather
# than where it is packaged. `worker.enabled=false` with `api.runWorker=true`
# (and api.replicas=1) is what makes single-container genuinely one workload.
#
# What single-container does, and what it costs:
#   - api.replicas is the pod count; web.replicas is ignored. The two scale
#     together now, and a dashboard change rolls the api with it.
#   - the -api and -web Services keep their names, ports and labels, and the
#     ingress is unchanged. Both simply select the same pod, so nothing in front
#     of the chart has to know which topology is installed.
#   - the web metrics listener moves to metrics.port + 1 (see metrics.webPort):
#     one network namespace cannot bind one port twice.
#   - the whole install is one failure domain. That is the trade being made.
#
# Switching an existing release replaces Deployments rather than editing them —
# expect the old ones to go and one to appear, which is a normal rollout, not a
# reinstall. Your data is in Postgres and untouched either way.
topology: split

# Applied to every pod. Useful for imagePullSecrets and a shared registry.
global:
  imagePullSecrets: []

api:
  image:
    repository: ghcr.io/fullmetalbober/indexterity-api
    # Defaults to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # One by default: the common install is a single organization managing its own
  # clusters, and a second pod there buys availability nobody asked for while
  # doubling the memory. Raise it for HA — both processes are stateless and
  # sessions live in Postgres — and read config.rateLimitMax as per replica when
  # you do. api.runWorker=true pins this at 1; the chart refuses anything else.
  replicas: 1
  port: 3001
  service:
    type: ClusterIP
    port: 3001
    annotations: {}
  # Reached two ways: by the browser, through the ingress at /api on the
  # dashboard's host (this is what keeps the session cookie first-party), and by
  # the web pods over this Service for server-side rendering. ingress.api below
  # adds a second hostname, and is only for callers outside the browser.
  #
  # Measured at 99 MB serving under a 192 MiB limit, and 104 MB idle under 512
  # MiB — the difference is V8's ceiling, not the workload. The limit is the
  # larger of the three because this is where sign-ins hash passwords.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 320Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Run the job runner inside the api process instead of a separate worker
  # container, for a small single-replica install that sets worker.enabled=false.
  # Keep it false otherwise: with the worker Deployment on, or with more than one
  # api replica, the cron schedule would be installed more than once.
  runWorker: false
  # Extra environment variables (name/value pairs).
  extraEnv: []

web:
  image:
    repository: ghcr.io/fullmetalbober/indexterity-web
    tag: ""
    pullPolicy: IfNotPresent
  # One by default, for the same reason as api.replicas above. Ignored in
  # single-container — there is one pod and api.replicas counts it. See
  # `topology` at the top of this file.
  replicas: 1
  port: 3000
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  # The dashboard's own public origin. REQUIRED when ingress is enabled: the api
  # trusts it for auth requests and session cookies are stored against it.
  publicUrl: ""
  # Where the WEB SERVER reaches the api, for its own server-side rendering.
  # Defaults to the in-cluster Service, or to 127.0.0.1 in single-container,
  # where the api is in the same pod. Not what the browser uses — that is /api on
  # publicUrl, routed by the ingress.
  apiUrl: ""
  # Overrides the canonical URL in the landing page's SEO tags (canonical,
  # og:url, og:image). Leave empty to keep the product's own public domain —
  # set it when running a fork or a separately-indexed staging copy.
  siteUrl: ""
  # 93 MB after forty server-side renders under a 128 MiB limit. It idles at 18
  # MB — nitro loads the SSR bundle on the first request, so an untouched
  # dashboard is not evidence of anything.
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# Read only when topology is single-container. One image carrying the api build,
# the web build and a supervisor; api.image and web.image are never pulled in
# that topology, and neither is a second copy of node.
#
# The supervisor is PID 1 and runs both processes: it splits the one environment
# into two (the api's METRICS_PORT and SENTRY_DSN stay as they are, the web
# server gets WEB_METRICS_PORT and WEB_SENTRY_DSN), points the dashboard at the
# api over loopback, forwards SIGTERM to both, and exits non-zero the moment
# either process does — so a half-dead container is restarted rather than left
# serving pages with no api behind them.
allInOne:
  image:
    repository: ghcr.io/fullmetalbober/indexterity-all-in-one
    # Defaults to .Chart.AppVersion, like the other two.
    tag: ""
    pullPolicy: IfNotPresent
  # One container, both processes, so this is the api's and the web's budgets
  # added together rather than either of them. The job runner lands here too when
  # api.runWorker is on, which is the usual reason to be in this topology at all.
  #
  # Measured at 85 MB under a 192 MiB limit and 214 MB under 512 MiB, serving the
  # same load — again the ceiling, not the work. 384 MiB is where the supervisor's
  # split gives the api a 172 MB heap and the dashboard 96 MB with a third of the
  # container left for everything that is not heap. It survived 128 MiB, but at
  # 99% of the limit and collecting constantly, which is not a place to run.
  resources:
    requests:
      cpu: 200m
      memory: 192Mi
    limits:
      memory: 384Mi

worker:
  # Runs the cron schedule (collect, apply, finalize, retention, digest).
  # Keep at ONE replica: graphile-worker coordinates through Postgres, but the
  # crontab would otherwise be scheduled by every pod.
  enabled: true
  # Jobs run at once in this process. Each one holds its own working set — a
  # collect pass keeps a cluster's index and collection statistics in memory
  # while it runs — so this multiplies the memory below rather than sharing it.
  # One is the right default: the pipeline is not latency-critical, and a fleet
  # large enough to queue behind a single runner is a fleet that should raise
  # this deliberately, with the limit raised alongside it.
  concurrency: 1
  # 65 MB running under a 128 MiB limit, with concurrency 2 and an idle fleet.
  # Add roughly a job's working set per unit of concurrency above one.
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# Prometheus metrics on a second port, served by all three workloads. Never
# routed by the ingress and carrying no auth: queue depth, cluster counts and
# pipeline state are operator information, so the endpoint is reachable
# in-cluster only until you deliberately expose it.
#
# Each workload answers for what only it can see, so scrape all three:
#   api     HTTP traffic, and everything read from the control-plane database —
#           clusters, recommendations by state, queue depth, dead-letter backlog
#   worker  job outcomes and durations, the regression gate, drops executed, and
#           which clusters it currently cannot reach
#   web     page render time per route, and the api as the dashboard server
#           experiences it (including "never answered")
metrics:
  # OFF by default, which is a change of posture rather than of opinion about
  # metrics: an exporter costs memory in every process that runs one, and a
  # self-hosted install with no Prometheus in front of it was paying that for an
  # endpoint nothing scraped. Turn it on — you want it on if anything is
  # scraping, and the alerting rules below are worth more than the megabytes.
  enabled: false
  port: 9464
  # The web server's listener. Empty means metrics.port when the dashboard has a
  # pod to itself, and metrics.port + 1 in single-container, where the api
  # has already bound metrics.port in the same network namespace and a second
  # listener on it would crash-loop on EADDRINUSE.
  #
  # This is the containerPort only. Both Services still publish metrics.port, so
  # scrapers, the chart's own test and the port-forward in the install notes read
  # the same number in every topology.
  webPort: ""
  # A Prometheus Operator ServiceMonitor per workload. Needs the
  # monitoring.coreos.com CRDs — off by default because a chart that assumes
  # them fails to install on a cluster that scrapes some other way.
  serviceMonitor:
    enabled: false
    # Extra labels, for an Operator that selects ServiceMonitors by label.
    labels: {}
    interval: 30s
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
  # Alerting rules for the failures that are otherwise silent: a schedule that
  # stopped running, a worker that is gone, observation being thrown away, the api
  # having lost Postgres. Same CRD requirement as the ServiceMonitor, so also off
  # by default.
  #
  # The stale-schedule windows come from the crontab in jobs/runner.ts — change
  # one there and the matching threshold here has to move with it.
  prometheusRule:
    enabled: false
    # Extra labels, for an Operator that selects PrometheusRules by label.
    labels: {}
    thresholds:
      # A runnable job no worker has claimed for this long. `apply` and `probe`
      # tick every five minutes, so fifteen means the worker is down or saturated.
      queueAgeSeconds: 900
      # Permanently failed jobs sitting in the queue. Retention prunes them after
      # a window, so a standing pile is real rather than history.
      deadLetterBacklog: 5
      # Fraction of the fleet unreachable at once. One cluster is the customer's
      # problem and they have already been emailed; half of them is ours.
      unreachableFleetRatio: 0.5
      # Auth 429s per second. Either a brute-force attempt or a real customer
      # behind NAT hitting the shared budget — both want a human.
      authRateLimited: 0.5
      # Regression gate rejections per day before it stops looking like bad luck
      # and starts looking like the engine proposing bad drops.
      regressionsPerDay: 3

# Error reporting to Sentry, from all three workloads. The other half of the
# picture above: the metrics say how OFTEN something failed, an error says WHAT
# failed and where. The worker is the reason this exists — a job that throws
# there is invisible unless somebody happens to be reading container logs at the
# time.
#
# Off unless you set a DSN, and the DSN is YOURS. This install reports to your
# Sentry organisation (or to a self-hosted Sentry), never to ours.
#
# What is sent is scrubbed before it leaves the pod: MongoDB and Postgres URIs
# are removed whole — hosts included, since a replica set's member list is your
# infrastructure — along with the credentials of any other URI and any field
# named like a secret. That runs on every event, breadcrumb and request body, and
# is unit-tested in packages/errors. Nothing here sends metrics or traces: the
# scrape endpoint above stays the only source of those.
errorReporting:
  # The api AND the worker report here. One project for the two of them on
  # purpose: they are one image, one release and one body of code — a fault in
  # the job or analysis layer is reachable from both, so a project per workload
  # would file it twice — and RUN_WORKER=true makes them one process anyway.
  # A `service` tag says which one answered.
  #
  # https://<key>@<org>.ingest.<region>.sentry.io/<project>
  dsn: ""
  # The dashboard server, which is a separate app with a separate release and
  # nothing shared with the api but the contract. Leave empty to send it to the
  # same project as the api.
  webDsn: ""
  # Which deployment an event came from. Staging and production must not share
  # an issue stream, and NODE_ENV calls both of them "production". Defaults to
  # the release namespace.
  environment: ""

# Runs `node dist/migrate.js` as a pre-install/pre-upgrade hook, before any new
# pod starts. Disable only if you apply migrations out of band.
migrations:
  enabled: true
  backoffLimit: 3
  # A request and deliberately no limit: this Job applies SQL and exits, and a
  # ceiling on it would turn a long migration on a large table into an OOMKill
  # halfway through a schema change — the one place in this chart where being
  # killed for memory is worse than being slow.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

config:
  logLevel: info
  # Reject sign-ins from unverified addresses (needs working SMTP).
  requireEmailVerification: false
  # Demand a second factor of owners before any owner-only mutation. False by
  # default so a fresh install can bootstrap its first account, but a hosted
  # deployment should turn it on: owner accounts can flip customers' clusters
  # live. GitHub sign-ins are exempt (their provider enforces its own).
  requireOwnerTwoFactor: false
  # Who may create an account:
  #   invite — default. The first account bootstraps the install; after that an
  #            address needs a pending invite from an owner.
  #   open   — anyone. Only for a deliberately public instance: the control
  #            plane dials customer-supplied hosts, so an open front door hands
  #            that reach to strangers.
  #   closed — nobody new.
  signupMode: invite
  # Allow connecting clusters on private/loopback addresses. Self-hosted
  # installs whose MongoDB sits on the same private network need this; a hosted
  # install must leave it false, or any account can probe the internal network.
  # Cloud metadata and other never-a-database ranges stay blocked either way.
  allowPrivateClusterTargets: false
  # Allow connecting clusters that do not offer validated TLS. Every outbound
  # connection requires it by default, including the ones the worker makes from
  # stored credentials — so a cluster connected without it stops being collected
  # and its owners are told why.
  #
  # Deliberately NOT part of allowPrivateClusterTargets above: a VPC-peered or
  # PrivateLink cluster is a private address that must still be forced to TLS,
  # so coupling a transport rule to an addressing rule would quietly weaken the
  # installs that most look like they need the exception. Set this only when the
  # MongoDB you manage genuinely serves no certificate and the network between
  # is trusted.
  allowInsecureClusterTls: false
  # Allow connecting clusters running a MongoDB major series newer than the one
  # this release was tested against. The floor is not overridable; this is the
  # ceiling. Refusing rather than guessing is the default because the engine
  # hides, drops and builds indexes on a live database, and a major release is
  # where command behaviour moves.
  allowUntestedMongoVersion: false
  # Same ceiling, for SQL Server: releases newer than the 2025 series this
  # release was probed against are refused unless this is set.
  allowUntestedMssqlVersion: false
  # The operator's retention ceiling, in days. Storage is your bill, so this caps
  # what any plan keeps AND what any plan may see. Empty means no ceiling — each
  # plan's own window decides.
  retentionDays: ""
  # Sockets the MongoDB driver may open against ONE connected cluster. The
  # driver's own default is 100, which is the wrong number twice here: a session
  # is held per cluster, so the worst case multiplies by the size of the fleet,
  # and the sockets are opened against a database that belongs to the customer,
  # whose connection budget is not ours to spend.
  #
  # Ten is well above what the collectors ask for — their fan-outs are per
  # replica-set member and each member has its own client, so the widest
  # concurrent use of a single connection is five reads. Raise it only if a
  # cluster's collect pass is visibly waiting on connections.
  mongoMaxPoolSize: 10
  # Postgres connections PER POOL — and a process holds more than one. The api has
  # a request pool, the jobs' pool and better-auth's; the worker has the jobs' pool
  # and graphile-worker's own. They are deliberately not merged: one shared pool
  # would let a slow report starve a sign-in of a connection, and that isolation is
  # worth a handful of backends.
  #
  # So the number to size your postgres against is roughly:
  #   api replicas x 3 x pgPoolMax  +  worker (pgPoolMax + concurrency + 1)
  # which is about 20 at the defaults, and grows by 15 per api replica you add. A
  # self-hosted postgres ships max_connections=100.
  #
  # Too low is latency, not failure — a query waits for a free connection rather
  # than erroring. Raise it alongside worker.concurrency.
  pgPoolMax: 5
  # How long an idle job runner waits, in milliseconds, before asking postgres
  # whether anything became due. Empty is the app's own 10 000.
  #
  # Polling is the runner's FALLBACK, not its mechanism: an enqueued job arrives
  # by NOTIFY and starts at once whatever this says. What waits is work that
  # becomes due by the CLOCK — a cron tick, a retry whose backoff expired — so
  # raising this buys a quieter database and costs retry latency, nothing else.
  # Worth setting on metered postgres, where 10s is ~260k round trips a month
  # from one idle worker and 60s is ~43k. The tightest schedule is five minutes,
  # so anything up to a minute is invisible to the pipeline.
  #
  # Given to the worker AND to the api, since api.runWorker embeds the runner.
  workerPollIntervalMs: ""
  # Per-IP request budgets, per minute. Raise them for a shared egress IP or a
  # test suite. Read rateLimitMax as PER REPLICA (see the api Deployment);
  # authRateLimitMax is read twice — Fastify applies it per replica to
  # /api/auth/*, and better-auth applies it to the credential endpoints counting
  # in Postgres, so that half is the whole deployment's budget.
  rateLimitMax: 300
  authRateLimitMax: 20
  # Whether a trusted proxy sits in front of the api. Behind an ingress or a
  # Service, every request arrives from the proxy, so the per-IP rate limits
  # collapse into one shared bucket unless the forwarded address is trusted.
  # "true", a hop count ("1"), or a CIDR list are all accepted. Leave it empty
  # when the api is directly exposed: trusting a forwarded header then lets any
  # client forge an address.
  #
  # REQUIRED with ingress.enabled, and nothing is inferred. This was derived
  # from ingress.enabled once and was wrong both ways — with an ingress it chose
  # "true", the dialect the paragraph below warns against, and without one it
  # chose "false" even though routing arranged outside the chart (a Traefik
  # IngressRoute onto the -web Service, say) is a proxy this chart cannot see.
  # An install with no ingress and a proxy in front still has to set this; the
  # chart says what it resolved at install time so the omission is visible.
  #
  # Prefer the CIDR list. better-auth counts the auth limits per client address
  # too — in Postgres, so across replicas — and it accepts only ranges: with
  # "true" it believes X-Forwarded-For only when the header holds a single
  # address, which it does not once an ingress has added itself. The auth limits
  # then apply to everybody together rather than per client.
  #
  # Use YOUR pod network's range rather than a habit: 10.0.0.0/8 covers many
  # clusters, k3s is 10.42.0.0/16, Calico defaults to 192.168.0.0/16 and an EKS
  # default VPC is 172.31.0.0/16. Narrower is better — this range is who may
  # claim to be someone else, so on a CNI that gives pods VPC addresses it is
  # every workload in the VPC, not just the ingress.
  trustProxy: ""
  # The plan a newly created organization lands on.
  #
  # SELF_HOSTED is the BUSL Additional Use Grant expressed as entitlements: one
  # connected cluster, and everything else on. The licence caps production
  # clusters and says nothing about features, seats or history — so neither does
  # this. Shipping the hosted FREE tier here would restrict you further than the
  # licence you are complying with, on hardware you are paying for yourself.
  #
  # It is not a security control and is not pretending to be one: anyone who
  # owns the database can change it. The licence is what binds; this only keeps
  # the software from quietly inviting you past the grant. Hold a commercial
  # licence for more clusters? Set the plan with set-plan.js.
  defaultOrgPlan: SELF_HOSTED
  # Storage price used for the $/month ROI headline.
  storageUsdPerGbMonth: ""
  # The origin better-auth signs sessions for. Defaults to the dashboard's own
  # public origin (web.publicUrl, or the ingress host), which is where the
  # session cookie actually lives — the browser never reaches the api directly.
  betterAuthUrl: ""
  # Allow a non-https auth URL. The api refuses one in production because the
  # session cookie's Secure flag depends on it, so this is ONLY for a cluster
  # that terminates no TLS anywhere — a Kind or minikube smoke test. Never set
  # it on anything a browser reaches over the network.
  allowInsecureAuthUrl: false

secrets:
  # Bring your own Secret instead of the values below. It must contain:
  # DATABASE_URL, BETTER_AUTH_SECRET, MASTER_KEY (and optionally SMTP_PASS,
  # GITHUB_CLIENT_SECRET).
  existingSecret: ""
  # postgres://user:pass@host:5432/indexterity
  databaseUrl: ""
  # Session signing key: openssl rand -base64 32
  betterAuthSecret: ""
  # KEK for envelope-encrypted cluster credentials: openssl rand -base64 32
  # LOSING THIS MAKES EVERY STORED CONNECTION STRING UNREADABLE — back it up.
  masterKey: ""
  # Which key version NEW rows are sealed with. Bump it alongside adding the key
  # to masterKeys below, then run rotate-key to re-seal the older rows.
  masterKeyVersion: ""
  # The KEKs, by version, rendered into the Secret as MASTER_KEY_V<n>. Every
  # version that any surviving cluster row was sealed with has to be here, or
  # that row cannot be decrypted — which is why rotate-key reports how many are
  # left and you keep the old key until it reports none.
  #
  #   masterKeyVersion: "2"
  #   masterKeys:
  #     1: "<the retired key>"     # only until rotate-key reports zero remaining
  #     2: "<the live key>"
  #
  # Version 1 may also be left in `masterKey` above, which is where it lived
  # before these existed; naming it here is the clearer half of a rotation.
  masterKeys: {}
  github:
    clientId: ""
    clientSecret: ""

# Outbound mail: invites, regression alerts, verification and reset links.
# Without a host, sending is a logged no-op.
smtp:
  host: ""
  port: 465
  user: ""
  password: ""
  from: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  # The dashboard's host. Must match web.publicUrl.
  host: ""
  tls:
    enabled: false
    secretName: ""
  # Expose the api under a second host for programmatic access. Not needed for
  # the dashboard to work.
  api:
    enabled: false
    host: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Left false by default: the node runtime writes to /tmp. Set true and mount
  # an emptyDir at /tmp if your policy requires it.
  readOnlyRootFilesystem: false
