apiVersion: v1
kind: Service
metadata:
  name: {{ include "indexterity.fullname" . }}-api
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    # A named port on this Service, not a route on the api. The ingress sends
    # traffic to the http port by name, so publishing the api host does not
    # publish this.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  # The pod behind this Service is the api's own, or — in the merged topologies —
  # the one pod that serves both. The label above and the name are unchanged
  # either way, which is what keeps the ingress, the ServiceMonitors and every
  # in-cluster caller ignorant of the topology.
  selector:
    {{- include "indexterity.selectorLabels" (dict "root" . "component" (include "indexterity.podComponent" (dict "root" . "workload" "api"))) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "indexterity.fullname" . }}-web
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      # web-* rather than http/metrics: a pod's port names are unique across its
      # containers, so merged these cannot carry the same names as the api's.
      # The names are the container's; the ports published here are the same
      # numbers in every topology.
      targetPort: web-http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    # Same reasoning as the api's: the ingress routes the http port by name, so
    # this one is not published with it.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: web-metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "indexterity.selectorLabels" (dict "root" . "component" (include "indexterity.podComponent" (dict "root" . "workload" "web"))) | nindent 4 }}

