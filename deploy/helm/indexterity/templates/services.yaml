apiVersion: v1
kind: Service
metadata:
  name: {{ include "indexterity.fullname" . }}-api
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    # A named port on this Service, not a route on the api. The ingress sends
    # traffic to the http port by name, so publishing the api host does not
    # publish this.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "indexterity.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "indexterity.fullname" . }}-web
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "indexterity.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
{{- if and .Values.metrics.enabled .Values.worker.enabled }}
---
# The worker's only Service, and it exists solely so a scrape can find the pod:
# nothing calls the worker, it reaches out. Headless for the same reason — there
# is one replica and nothing to load-balance.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "indexterity.fullname" . }}-worker-metrics
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "indexterity.selectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
{{- end }}
