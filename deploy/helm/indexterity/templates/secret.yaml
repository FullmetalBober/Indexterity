{{- include "indexterity.validateSecrets" . -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "indexterity.fullname" . }}-secrets
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
  # The KEK for envelope-encrypted cluster connection strings. Back it up
  # outside the cluster: without it, stored credentials cannot be decrypted.
  MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  SMTP_PASS: {{ .Values.smtp.password | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.github.clientSecret | quote }}
{{- end }}
