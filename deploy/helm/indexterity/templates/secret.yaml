{{- include "indexterity.validateSecrets" . -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "indexterity.fullname" . }}-secrets
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
{{- if .Values.secrets.cronTriggerSecret }}
  CRON_TRIGGER_SECRET: {{ .Values.secrets.cronTriggerSecret | quote }}
{{- end }}
  # The KEK for envelope-encrypted cluster connection strings. Back it up
  # outside the cluster: without it, stored credentials cannot be decrypted.
  MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  {{- /* A rotation's keys. values.yaml has told operators to "bump alongside
        adding MASTER_KEY_V<n>" since the rotation shipped, and until now this
        template had no way to carry one — so the only route was to abandon these
        values for `existingSecret`. Keyed by version rather than a fixed V1/V2
        pair, because a rotation happens more than once. */}}
  {{- range $version, $key := .Values.secrets.masterKeys }}
  MASTER_KEY_V{{ $version }}: {{ $key | quote }}
  {{- end }}
  SMTP_PASS: {{ .Values.smtp.password | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.github.clientSecret | quote }}
{{- end }}
