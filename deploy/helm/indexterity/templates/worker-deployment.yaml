{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indexterity.fullname" . }}-worker
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Deliberately one: graphile-worker coordinates job execution through
  # Postgres, but every replica would install the crontab, so a second pod
  # means duplicate scheduling.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "indexterity.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indexterity.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "indexterity.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The worker drains its pool and finishes in-flight jobs on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "indexterity.apiRuntimeImage" . }}
          imagePullPolicy: {{ include "indexterity.apiRuntimePullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["node", "apps/api/dist/worker.js"]
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          {{- end }}
          env:
            {{- include "indexterity.coreEnv" . | nindent 12 }}
            {{- include "indexterity.mailEnv" . | nindent 12 }}
            {{- include "indexterity.metricsEnv" (dict "root" . "port" .Values.metrics.port) | nindent 12 }}
            {{- include "indexterity.errorsEnv" (dict "root" . "dsn" .Values.errorReporting.dsn) | nindent 12 }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
