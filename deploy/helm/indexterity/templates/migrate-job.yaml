{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "indexterity.fullname" . }}-migrate
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs to completion BEFORE any new api/web pod starts, so the
    # schema is never behind the code. Idempotent — applied migrations skip.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "indexterity.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # Deliberately NOT the chart's ServiceAccount. This Job is a pre-install
      # hook, and hooks run before the release's own resources exist — naming it
      # here made every fresh `helm install` fail with "serviceaccount
      # indexterity not found" and the Job never got a pod. The account carries
      # annotations only (it already disables token mounting), so the migration
      # loses nothing by using the namespace default, and mounts no token
      # either: it talks to postgres and exits.
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "indexterity.apiRuntimeImage" . }}
          imagePullPolicy: {{ include "indexterity.apiRuntimePullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # drizzle-kit is a devDependency and pruned from the runtime image;
          # this entrypoint uses the drizzle-orm migrator instead.
          command: ["node", "apps/api/dist/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # An operator-supplied Secret already exists, so the hook can
                  # read it; a chart-generated one does not yet, hence the
                  # hook-scoped copy in migrate-secret.yaml.
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "indexterity.fullname" . }}-migrate{{ end }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
