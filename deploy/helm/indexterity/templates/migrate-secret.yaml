{{- if and .Values.migrations.enabled (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "indexterity.fullname" . }}-migrate
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # The migration runs as a pre-install hook, and hooks run BEFORE the
    # release's own resources exist — so it cannot read the main Secret. Naming
    # that one made every fresh install sit in CreateContainerConfigError until
    # helm timed out.
    #
    # A hook-scoped copy instead of moving the main Secret into the hook phase:
    # a hook resource is not part of the release, so `helm uninstall` would
    # leave the real Secret — MASTER_KEY and all — behind in the namespace.
    # This one carries only the database URL and is deleted the moment the
    # migration succeeds.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
