{{- include "indexterity.validateAuthUrl" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indexterity.fullname" . }}-api
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "indexterity.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indexterity.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when the managed Secret changes.
        {{- if not .Values.secrets.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "indexterity.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "indexterity.apiImage" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- include "indexterity.coreEnv" . | nindent 12 }}
            {{- include "indexterity.mailEnv" . | nindent 12 }}
            {{- include "indexterity.metricsEnv" . | nindent 12 }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            # Browser auth requests arrive through the dashboard's server
            # functions, which send this origin — better-auth must trust it.
            - name: WEB_ORIGIN
              value: {{ include "indexterity.webOrigin" . | quote }}
            # Only the api serves auth, so the signing key lives here rather
            # than in the shared core env. It was written into the Secret and
            # never referenced by any container — the api could not boot.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "indexterity.secretName" . }}
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              value: {{ include "indexterity.betterAuthUrl" . | quote }}
            {{- if .Values.config.allowInsecureAuthUrl }}
            - name: ALLOW_INSECURE_AUTH_URL
              value: "true"
            {{- end }}
            - name: TRUST_PROXY
              value: {{ include "indexterity.trustProxy" . | quote }}
            - name: REQUIRE_EMAIL_VERIFICATION
              value: {{ .Values.config.requireEmailVerification | quote }}
            - name: SIGNUP_MODE
              value: {{ .Values.config.signupMode | quote }}
            {{- if .Values.secrets.github.clientId }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.secrets.github.clientId | quote }}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "indexterity.secretName" . }}
                  key: GITHUB_CLIENT_SECRET
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
