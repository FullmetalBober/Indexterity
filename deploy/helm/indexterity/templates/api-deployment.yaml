{{- include "indexterity.validateTopology" . -}}
{{- include "indexterity.validateSchedule" . -}}
{{- include "indexterity.validateAuthUrl" . -}}
{{- include "indexterity.validateTrustProxy" . -}}
{{- /*
The api Deployment in the default topology, and the WHOLE serving tier in
single-container — where the dashboard is a second process inside this container
rather than a Deployment of its own, so there is one place the pod is described
and nothing to keep in step. web-deployment.yaml renders nothing merged; the
Services and the ingress are unchanged either way.
*/ -}}
{{- $merged := include "indexterity.merged" . -}}
{{- $component := include "indexterity.podComponent" (dict "root" . "workload" "api") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indexterity.fullname" . }}{{ if not $merged }}-api{{ end }}
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  # The pod count for every topology: merged, this counts pods that serve the
  # dashboard too, and web.replicas is ignored.
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "indexterity.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indexterity.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        # Roll the pods when the managed Secret changes.
        {{- if not .Values.secrets.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $merged }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "indexterity.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        # `app` rather than `api` in single-container, because this container is
        # not the api: it is a supervisor running the api (pipeline included) and
        # the dashboard. `kubectl logs` returns both.
        - name: {{ if $merged }}app{{ else }}api{{ end }}
          image: {{ if $merged }}{{ include "indexterity.allInOneImage" . }}{{ else }}{{ include "indexterity.apiImage" . }}{{ end }}
          imagePullPolicy: {{ if $merged }}{{ .Values.allInOne.image.pullPolicy }}{{ else }}{{ .Values.api.image.pullPolicy }}{{ end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            {{- if $merged }}
            - name: web-http
              containerPort: {{ .Values.web.port }}
            {{- if .Values.metrics.enabled }}
            # The second listener in one network namespace, so not metrics.port.
            - name: web-metrics
              containerPort: {{ include "indexterity.webMetricsPort" . }}
            {{- end }}
            {{- end }}
          env:
            {{- if not $merged }}
            {{- /* Single-container is the one case this must NOT be set from here:
                   the supervisor divides the container's budget between two
                   processes at runtime, and an inherited cap is its signal that
                   the deployment has already decided — it would then hand the
                   same ceiling to both. */}}
            {{- include "indexterity.heapEnv" (dict "limit" .Values.api.resources.limits.memory) | nindent 12 }}
            {{- end }}
            {{- include "indexterity.coreEnv" . | nindent 12 }}
            {{- include "indexterity.mailEnv" . | nindent 12 }}
            {{- include "indexterity.metricsEnv" (dict "root" . "port" .Values.metrics.port) | nindent 12 }}
            {{- include "indexterity.errorsEnv" (dict "root" . "dsn" .Values.errorReporting.dsn) | nindent 12 }}
            {{- include "indexterity.apiEnv" . | nindent 12 }}
            {{- if $merged }}
            {{- /* Read by the SUPERVISOR, not by either process: one environment
                   has to describe two of them, and these are the two variables
                   they would otherwise fight over. */}}
            {{- if .Values.metrics.enabled }}
            - name: WEB_METRICS_PORT
              value: {{ include "indexterity.webMetricsPort" . | quote }}
            {{- end }}
            {{- with .Values.errorReporting.webDsn }}
            # A second Sentry project for the dashboard. Absent, the supervisor
            # hands the web server the api's DSN, which is what the split
            # topology does when webDsn is empty.
            - name: WEB_SENTRY_DSN
              value: {{ . | quote }}
            {{- end }}
            {{- include "indexterity.webEnv" (dict "root" . "shared" true) | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              {{- if $merged }}
              # /api/health through the dashboard's own /api passthrough, which is
              # the one request that proves all of it: the web server answered,
              # the api answered it, and the loopback hop between them works. A
              # probe on either port alone would report a half-dead container
              # ready.
              path: /api/health
              port: web-http
              {{- else }}
              path: /api/health
              port: http
              {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 10
            # One hop through the dashboard in single-container, and the default
            # probe timeout is one second. See the liveness note below.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              # /api/health on the api's own port in every topology, including
              # single-container — where this probe restarts BOTH processes, so
              # what it asks has to be cheap and true.
              #
              # It asked for `/` here, reasoning that liveness should not die of a
              # Postgres blip. The reasoning was right and the target was wrong:
              # `/` is a server-side React render, measured at 908ms cold against
              # kubernetes' ONE SECOND default probe timeout, so on a loaded node
              # three misses restart a container that was serving perfectly. CI
              # found it and no local run could — this endpoint is 1.7ms and
              # touches no database, so it stays inside any timeout, and it still
              # does not fail on a Postgres outage because the handler returns a
              # literal.
              #
              # Nothing is lost by not probing the dashboard from here: the
              # supervisor exits the container the moment either process dies,
              # which is the same guarantee a probe would give and arrives sooner.
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- /* An if rather than `ternary`, which takes a real bool and would
                   be handed the merged helper's string. */}}
            {{- if $merged }}
            {{- toYaml .Values.allInOne.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.api.resources | nindent 12 }}
            {{- end }}
          {{- with .Values.api.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- /*
The tunnel service (D112), in THIS pod because it listens on loopback: the api
reaches it at 127.0.0.1 and nothing outside the pod can reach it at all. That is
what keeps a customer's private key off the network and the SOCKS5 proxy into
their network unreachable — the same boundary that held when the api spawned it
as a child process.

It takes the chart's OWN securityContext, unmodified, which is the payoff for
terminating the peering in userspace: no NET_ADMIN, no /dev/net/tun, no volume,
nonroot and `drop: ALL` like everything else here.

After the app container, so `kubectl logs` and `kubectl exec` keep defaulting to
the one anybody asking for "the api" means.
*/}}
{{- if .Values.tunnel.enabled }}
        - name: tunnel
          image: {{ include "indexterity.tunnelImage" . }}
          imagePullPolicy: {{ .Values.tunnel.image.pullPolicy }}
          securityContext:
            {{- /* The chart's context, with the root filesystem read-only whatever
                   it says: this image is `scratch` plus one static binary and the
                   process writes nothing — no cache, no temp file, no socket on
                   disk. The api container cannot have that (node wants /tmp),
                   which is why the shared value is false and this one overrides
                   it rather than the reverse. */}}
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) .Values.securityContext) | nindent 12 }}
          env:
            {{- /* The same variable the api is given, from the same value: one
                   number that cannot be configured into disagreement. */}}
            - name: TUNNEL_PORT
              value: {{ .Values.tunnel.port | quote }}
          resources:
            {{- toYaml .Values.tunnel.resources | nindent 12 }}
{{- end }}
{{- /*
An operator's OWN sidecars, rendered verbatim — a third-party VPN client needs
NET_ADMIN and a device mount, which is the exact opposite of this chart's
securityContext, so imposing that here would make the values unusable for the
only job they have.
*/}}
          {{- with .Values.api.extraContainers }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
      {{- with .Values.api.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.api.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
