{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled — it is also the dashboard's public origin" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "indexterity.fullname" . }}
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if and .Values.ingress.api.enabled .Values.ingress.api.host }}
        - {{ .Values.ingress.api.host | quote }}
        {{- end }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    # The dashboard. Browsers only ever talk to this host: every api call goes
    # through the web app's server functions.
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "indexterity.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
    {{- if .Values.ingress.api.enabled }}
    {{- if not .Values.ingress.api.host }}
    {{- fail "ingress.api.host is required when ingress.api.enabled" }}
    {{- end }}
    # Optional: the api exposed for programmatic access.
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "indexterity.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
    {{- end }}
{{- end }}
