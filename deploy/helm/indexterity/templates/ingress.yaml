{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled — it is also the dashboard's public origin" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "indexterity.fullname" . }}
  labels:
    {{- include "indexterity.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if and .Values.ingress.api.enabled .Values.ingress.api.host }}
        - {{ .Values.ingress.api.host | quote }}
        {{- end }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    # One host, two paths. The browser sees a single origin, so the session
    # cookie it gets from /api/auth is first-party and travels with every other
    # /api call by itself — no CORS, and nothing to proxy server-side.
    #
    # Ingress matches the longest prefix, so /api wins over / regardless of
    # order; writing it first keeps that obvious to whoever reads this next.
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "indexterity.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "indexterity.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
    {{- if .Values.ingress.api.enabled }}
    {{- if not .Values.ingress.api.host }}
    {{- fail "ingress.api.host is required when ingress.api.enabled" }}
    {{- end }}
    # A second hostname for the api is optional in a new sense: the dashboard
    # does not need it any more. Leave it off unless something outside the
    # browser actually consumes the api.
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "indexterity.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
    {{- end }}
{{- end }}
