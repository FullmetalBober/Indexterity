# The compose stack's reverse proxy: one origin for the browser, the same shape
# the ingress gives production (deploy/helm/.../ingress.yaml).
#
# This is not a convenience. The dashboard has no relay any more — the browser
# calls the api itself — and the session cookie only reaches the api if both are
# on one origin. Without this, signing in through http://localhost:3000 would set
# a cookie the api never sees, which is exactly the class of "works in the chart,
# not in compose" difference that #2 cost us.
#
# The web server still dials the api directly at API_URL for its SSR reads; that
# is server-to-server on the compose network and does not come through here.

# Vite's dev server talks HMR over a websocket on this same origin, so the
# upgrade has to be forwarded. `map` belongs to the http context, which is where
# nginx includes conf.d/*.conf from.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # No client_max_body_size worth tuning: the largest thing anyone posts here is
  # a connection string.

  # Longest prefix wins in nginx too, so /api beats / whatever the order. It is
  # written first to keep that obvious to whoever reads this next.
  location /api {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # better-auth checks Origin against its trusted origins, so it has to arrive
    # unaltered — rewriting it here would make every auth request look
    # cross-site to the api.
    proxy_set_header Origin $http_origin;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
