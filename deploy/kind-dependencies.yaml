# PostgreSQL and MongoDB for the Kind smoke test only.
#
# The chart bundles neither on purpose: the control plane's postgres holds every
# customer's sealed connection string and belongs on managed storage, and the
# mongo here is a stand-in for a customer cluster. Neither manifest has a volume
# — the cluster is thrown away after the test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - { name: POSTGRES_USER, value: indexterity }
            - { name: POSTGRES_PASSWORD, value: indexterity }
            - { name: POSTGRES_DB, value: indexterity }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "indexterity"] }
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels: { app: mongo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports: [{ containerPort: 27017 }]
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
